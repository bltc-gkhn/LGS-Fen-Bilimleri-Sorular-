      solution: `<b>Doğru Cevap: C</b><br><br><b>Çözüm Açıklaması:</b><br>Sadece belli bir tarihten bahsedildiği için ve uzun süreye dayalı bir veri olmadığı için bu durum bir hava olayıdır.`
    },
    {
      year: "2025 LGS",
      unit: `1. ÜNİTE: MEVSİMLER VE İKLİM`,
      topic: `Mevsimlerin Oluşumu`,
      image: `soru_12.png`,
      text1: `Yerküre üzerinde eş yükseltide bulunan K ve L şehirlerinde uzun yıllar boyunca yapılan ölçümlerden elde edilen aylık ortalama sıcaklık değerleri tablodaki gibidir.\n\nTablodaki verilerden yararlanılarak K şehrinin Kuzey yarım kürede, L şehrinin Güney yarım kürede olduğu tespit edilmiştir.`,
      text2: `Bu tespit, aşağıdaki verilerin hangisinden yararlanılarak yapılmıştır?`,
      optionsType: `text`,
      options: [
        `Ortalama sıcaklık değerinin K şehrinde temmuz ve ağustos aylarında aynı, L şehrinde ise haziran ve temmuz aylarında aynı olması`,
        `Ocak ayı dışındaki tüm aylarda ortalama sıcaklık değerinin K şehrinde L şehrindekinden daha fazla olması`,
        `Ocak ayından haziran ayına kadar ortalama sıcaklık değerinin K şehrinde artarken L şehrinde azalması`,
        `Her iki şehirde de ocak ayı ortalama sıcaklık değerlerinin birbirine eşit olması`
      ],
      correct: 2, // C Şıkkı
      solution: `<b>Doğru Cevap: C</b><br><br><b>Çözüm Açıklaması:</b><br>Verilen tabloya göre Ocak ayından haziran ayına kadar ortalama sıcaklık değerinin K şehrinde artarken L şehrinde azaldığı görülmektedir. Bu durumda K şehrinin KYK'de L şehrinin de GYK'de olduğu anlaşılır.`
    }
  ];

  let currentIndex = 0;
  let selectedOptionIndex = null;

  function loadQuestion(index) {
    const q = questionBank[index];
    selectedOptionIndex = null;
    
    document.getElementById('badgeUnit').innerText = q.unit;
    document.getElementById('badgeTopic').innerText = q.topic;
    document.getElementById('badgeNumber').innerText = `Soru: ${index + 1}/${questionBank.length} • ${q.year}`;
    
    document.getElementById('qText1').innerText = q.text1;
    document.getElementById('qText2').innerText = q.text2;
    
    const imageBox = document.getElementById('imageBox');
    const imgEl = document.getElementById('qImage');
    const fallbackEl = document.getElementById('fallbackText');
    
    if (q.image && q.image.trim() !== '') {
      imageBox.style.display = 'flex';
      fallbackEl.style.display = 'none';
      imgEl.style.display = 'block';
      imgEl.src = q.image;
      document.getElementById('missingImageName').innerText = q.image;
    } else {
      imageBox.style.display = 'none';
    }

    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    
    q.options.forEach((optValue, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      
      if (q.optionsType === "image") {
        btn.innerHTML = `<b>${letters[i]})</b>&nbsp;<img src="${optValue}" class="option-img" alt="${letters[i]} Şıkkı Görseli" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'30\'><text x=\'0\' y=\'20\' fill=\'red\'>Görsel Yok (${optValue})</text></svg>';">`;
      } else {
        btn.innerHTML = `<b>${letters[i]})</b>&nbsp;${optValue}`;
      }

      btn.onclick = () => selectOption(i);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('solutionPanel').style.display = 'none';
    
    let fullSolutionHTML = q.solution;
    if (q.solutionImage) {
      fullSolutionHTML += `<br><img src="${q.solutionImage}" class="solution-img" alt="Çözüm Görseli" onerror="this.style.display='none'">`;
    }
    document.getElementById('textSolution').innerHTML = fullSolutionHTML;

    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === questionBank.length - 1);
  }

  function handleImageError() {
    document.getElementById('qImage').style.display = 'none';
    document.getElementById('fallbackText').style.display = 'block';
  }

  function selectOption(index) {
    selectedOptionIndex = index;
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, i) => {
      btn.classList.toggle('selected', i === index);
    });
  }

  function checkAnswer() {
    if (selectedOptionIndex === null) {
      alert("Lütfen önce bir şık seçiniz!");
      return;
    }
    
    const q = questionBank[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');
    
    buttons.forEach((btn, i) => {
      btn.classList.remove('correct', 'wrong');
      if (i === q.correct) {
        btn.classList.add('correct');
      } else if (i === selectedOptionIndex) {
        btn.classList.add('wrong');
      }
    });
    
    document.getElementById('solutionPanel').style.display = 'block';
  }

  function changeQuestion(step) {
    currentIndex += step;
    if (currentIndex >= 0 && currentIndex < questionBank.length) {
      loadQuestion(currentIndex);
    }
  }

  loadQuestion(0);
</script>

</body>

<div class="container">

<script>
    function checkAnswer(btn, isCorrect) {
        const parent = btn.parentElement;
        const buttons = parent.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        
        if(isCorrect) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
        }
        
        const answerBox = parent.nextElementSibling;
        if(answerBox && answerBox.classList.contains('answer-box')) {
            answerBox.style.display = 'block';
        }
    }
</script>
